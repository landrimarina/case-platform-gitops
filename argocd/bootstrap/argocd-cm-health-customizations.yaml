apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  resource.customizations.health.networking.k8s.io_Ingress: |
    hs = {}
    if obj.status ~= nil and obj.status.loadBalancer ~= nil and obj.status.loadBalancer.ingress ~= nil and #obj.status.loadBalancer.ingress > 0 then
      hs.status = "Healthy"
      hs.message = "Ingress has load balancer address"
      return hs
    end
    if obj.spec ~= nil and obj.spec.ingressClassName == "apisix" then
      hs.status = "Healthy"
      hs.message = "APISIX ingress does not publish LoadBalancer status"
      return hs
    end
    hs.status = "Progressing"
    hs.message = "Waiting for ingress load balancer address"
    return hs
