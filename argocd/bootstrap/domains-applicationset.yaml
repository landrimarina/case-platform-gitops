apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: case-platform-domains
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - appName: case-platform-anc-backend
            namespace: case-platform-anc
            chartPath: helm/platform-backend
            releaseName: case-platform-anc-backend
            valuesPath: applications/domains/anc/backend/values.yaml
            imageAlias: anc
            imageRepository: ghcr.io/landrimarina/case-platform-anc-backend
          - appName: case-platform-pgcc-backend
            namespace: case-platform-pgcc
            chartPath: helm/platform-backend
            releaseName: case-platform-pgcc-backend
            valuesPath: applications/domains/pgcc/backend/values.yaml
            imageAlias: pgcc
            imageRepository: ghcr.io/landrimarina/case-platform-pgcc-backend
      template:
        metadata:
          annotations:
            argocd-image-updater.argoproj.io/image-list: "{{ .imageAlias }}={{ .imageRepository }}"
            argocd-image-updater.argoproj.io/{{ .imageAlias }}.update-strategy: digest
            argocd-image-updater.argoproj.io/{{ .imageAlias }}.allow-tags: regexp:^latest$
            argocd-image-updater.argoproj.io/{{ .imageAlias }}.helm.image-name: image.repository
            argocd-image-updater.argoproj.io/{{ .imageAlias }}.helm.image-tag: image.tag
            argocd-image-updater.argoproj.io/write-back-method: git
            argocd-image-updater.argoproj.io/write-back-target: "helmvalues:{{ .valuesPath }}"
    - list:
        elements:
          - appName: case-platform-anc-frontend
            namespace: case-platform-anc
            chartPath: helm/domain-application
            releaseName: anc
            valuesPath: applications/domains/anc/frontend/values.yaml
            imageAlias: ancmfe
            imageRepository: ghcr.io/landrimarina/case-platform-anc-mfe
          - appName: case-platform-pgcc-frontend
            namespace: case-platform-pgcc
            chartPath: helm/domain-application
            releaseName: pgcc
            valuesPath: applications/domains/pgcc/frontend/values.yaml
            imageAlias: pgccmfe
            imageRepository: ghcr.io/landrimarina/case-platform-pgcc-mfe
      template:
        metadata:
          annotations:
            argocd-image-updater.argoproj.io/image-list: "{{ .imageAlias }}={{ .imageRepository }}"
            argocd-image-updater.argoproj.io/{{ .imageAlias }}.update-strategy: digest
            argocd-image-updater.argoproj.io/{{ .imageAlias }}.allow-tags: regexp:^latest$
            argocd-image-updater.argoproj.io/{{ .imageAlias }}.helm.image-name: frontend.image.repository
            argocd-image-updater.argoproj.io/{{ .imageAlias }}.helm.image-tag: frontend.image.tag
            argocd-image-updater.argoproj.io/write-back-method: git
            argocd-image-updater.argoproj.io/write-back-target: "helmvalues:{{ .valuesPath }}"
  template:
    metadata:
      name: "{{ .appName }}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: case-platform
      sources:
        - repoURL: https://github.com/landrimarina/case-platform-gitops.git
          targetRevision: develop
          path: "{{ .chartPath }}"
          helm:
            releaseName: "{{ .releaseName }}"
            valueFiles:
              - "$values/{{ .valuesPath }}"
        - repoURL: https://github.com/landrimarina/case-platform-gitops.git
          targetRevision: develop
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
