apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: case-platform
  namespace: argocd
spec:
  description: Governance delle applicazioni e dei componenti Case Platform

  sourceRepos:
    - https://github.com/landrimarina/case-platform-gitops.git
    - https://cloudnative-pg.github.io/charts
    - https://apache.github.io/apisix-helm-chart

  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: cnpg-system
      server: https://kubernetes.default.svc
    - namespace: case-platform-data
      server: https://kubernetes.default.svc
    - namespace: keycloak
      server: https://kubernetes.default.svc
    - namespace: case-platform
      server: https://kubernetes.default.svc
    - namespace: case-platform-anc
      server: https://kubernetes.default.svc
    - namespace: apisix
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: networking.k8s.io
      kind: IngressClass
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"