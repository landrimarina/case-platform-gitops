apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: case-platform-shell
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: shell=ghcr.io/landrimarina/case-platform-shell
    argocd-image-updater.argoproj.io/shell.update-strategy: digest
    argocd-image-updater.argoproj.io/shell.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/shell.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/shell.helm.image-tag: image.tag
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:applications/platform/frontend/values.yaml
spec:
  project: case-platform

  sources:
    - repoURL: https://github.com/landrimarina/case-platform-gitops.git
      targetRevision: develop
      path: helm/platform-frontend
      helm:
        releaseName: case-platform-shell
        valueFiles:
          - $values/applications/platform/frontend/values.yaml

    - repoURL: https://github.com/landrimarina/case-platform-gitops.git
      targetRevision: develop
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: case-platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true