apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-platform-shell
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: case-platform-shell
  template:
    metadata:
      labels:
        app: case-platform-shell
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: shell
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5