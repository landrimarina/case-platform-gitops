apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak

metadata:
  name: case-platform-keycloak
  namespace: keycloak

spec:
  instances: 1

  db:
    vendor: postgres
    host: case-platform-postgresql-rw.case-platform-data.svc.cluster.local
    port: 5432
    database: keycloak

    usernameSecret:
      name: keycloak-db-secret
      key: username

    passwordSecret:
      name: keycloak-db-secret
      key: password

  http:
    httpEnabled: true
    httpPort: 8080

  hostname:
    strict: false

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi