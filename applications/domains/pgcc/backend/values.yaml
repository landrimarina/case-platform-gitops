replicaCount: 1

imagePullSecrets:
  - name: ghcr-pull

image:
  repository: ghcr.io/landrimarina/case-platform-pgcc-backend
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 8082

probes:
  liveness:
    path: /api/pgcc/home
  readiness:
    path: /api/pgcc/home

env: []
envFromSecret: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  path: /pgcc/api
