replicaCount: 1

imagePullSecrets:
  - name: ghcr-pull

image:
  repository: ghcr.io/landrimarina/case-platform-anc-backend
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 8083

probes:
  liveness:
    path: /api/anc/home
  readiness:
    path: /api/anc/home

env: []
envFromSecret: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  path: /anc/api
